name: vfroom_mobile
description: "VYRO / FitWardrobe AI - Personal Mobile Virtual Try-On & Wardrobe Stylist"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & API
  dio: ^5.4.3+1

  # Hardware & Camera
  camera: ^0.10.6
  image_picker: ^1.1.2

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
